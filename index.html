<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>САЙТ ВИМКНЕНО</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 42, 95, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .offline-card {
      background: #0e131d;
      border: 1px solid rgba(255, 42, 95, 0.3);
      padding: 45px 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 95, 0.15);
      max-width: 460px;
      width: 100%;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(255, 42, 95, 0.6));
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ff2a5f;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 42, 95, 0.1);
      border: 1px solid rgba(255, 42, 95, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      color: #ff2a5f;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #ff2a5f;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff2a5f;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">🛑</div>
    <h1>Сайт вимкнено</h1>
    <p>Роботу сайту призупинено за рішенням адміністратора проєкту. Доступ тимчасово закрито.</p>
    <div class="status-badge">
      <span class="dot"></span> Offline Mode
    </div>
  </div>
</body>
</html>
